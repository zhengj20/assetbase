[project]
name = "guding-backend"
version = "1.0.0"
description = "房地产行业固定资产管理系统 - FastAPI 后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiomysql>=0.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    "openpyxl>=3.1.0",
    "cryptography>=50.0.1",
    "python-multipart>=0.0.9",
    "pillow>=12.3.0",
]

[tool.uv]
package = false
